<mat-toolbar class="toolbar">
  <h1 class="title">World Alerts</h1>
  <nav class="nav" aria-label="Main">
    <a mat-button routerLink="/alerts" routerLinkActive="active" ariaCurrentWhenActive="page">
      Alerts
    </a>
    <a mat-button routerLink="/connections" routerLinkActive="active" ariaCurrentWhenActive="page">
      Connections
    </a>
  </nav>
  <span class="spacer"></span>
  @if (currentUser.users.error()) {
    <p class="users-error" role="alert">
      Could not load users.
      <button mat-button type="button" (click)="currentUser.users.reload()">Retry</button>
    </p>
  } @else {
    <app-user-switcher
      [users]="currentUser.users.value()"
      [selectedId]="currentUser.userId()"
      (selected)="currentUser.select($event)"
    />
  }
</mat-toolbar>

<main class="main">
  <router-outlet />
</main>
